<h2 mat-dialog-title>Register Payment</h2>
<div mat-dialog-content>
  <p>
    <strong>{{ data.loan.applicantName }}</strong> — Current balance:
    {{ data.loan.currentBalance | currency }}
  </p>
  <mat-form-field appearance="outline" class="payment-dialog__field">
    <mat-label>Payment amount</mat-label>
    <input matInput type="number" [formControl]="amountControl" min="0.01" step="0.01" />
    <mat-error *ngIf="amountControl.hasError('required')">Amount is required.</mat-error>
    <mat-error *ngIf="amountControl.hasError('min')">Amount must be greater than zero.</mat-error>
    <mat-error *ngIf="amountControl.hasError('max')">Amount cannot exceed the current balance.</mat-error>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()">Pay</button>
</div>
