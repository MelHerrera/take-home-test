<div class="login">
  <mat-card class="login__card">
    <mat-card-header>
      <mat-card-title>Loan Management — Sign In</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login__form">
        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="login__field">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        <div *ngIf="errorMessage" class="login__error">{{ errorMessage }}</div>

        <button mat-flat-button color="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
