<main class="loans">
  <section class="loans--container">
    <h1>Loan Management</h1>

    <div *ngIf="loading" class="loans--loading">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading loans...</p>
    </div>

    <div *ngIf="errorMessage" class="loans--error">
      {{ errorMessage }}
    </div>

    <table
      *ngIf="!loading && !errorMessage"
      mat-table
      [dataSource]="loans"
      class="mat-elevation-z8"
    >
      <ng-container matColumnDef="applicantName">
        <th mat-header-cell *matHeaderCellDef>Applicant</th>
        <td mat-cell *matCellDef="let element">{{ element.applicantName }}</td>
      </ng-container>

      <ng-container matColumnDef="amountRequested">
        <th mat-header-cell *matHeaderCellDef>Loan Amount</th>
        <td mat-cell *matCellDef="let element">
          {{ element.amountRequested | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="currentBalance">
        <th mat-header-cell *matHeaderCellDef>Current Balance</th>
        <td mat-cell *matCellDef="let element">
          {{ element.currentBalance | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">
          <mat-chip [class.loans__chip--active]="element.status === 'Active'"
                    [class.loans__chip--paid]="element.status === 'Paid'">
            {{ element.status }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button
            mat-stroked-button
            color="primary"
            [disabled]="element.status === 'Paid' || payingLoanId === element.id"
            (click)="openPaymentDialog(element)"
          >
            {{ payingLoanId === element.id ? 'Paying...' : 'Pay' }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </section>
</main>
